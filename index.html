<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EsToDoList</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-amber-100 text-slate-800 min-h-screen">

    <header class="bg-amber-300 text-base">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">

        <h1 class=" text-xl font-bold">EsToDoList</h1>
        
        <span class="hidden sm:inline text-sm">organize sua rotina escolar</p>
        </div>
    </header>

    
    <main class="max-w-5xl mx-auto px-4 py-6 grid grid-cols-1 gap-6">
        <! -- coluna 1: criar, pesquisar e filtar -- >
        <section class="bg-white rounded-xl shadow p-4 space-y-4">
            <form class="flex flex-col md:flex-row gap-3">

                <input type="text" placeholder="nova tarefa" class="border rounded-lg px-3 py-3 md: flex-auto">

                <input type="date" class="border rounded-lg px-3 py-3">

                <button type="submit" class="bg-yellow-300 text-black rounded-lg px-4 py-3 font-semibold hover:bg-amber-400">adicionar</button>
            </form>

            <input type="text" placeholder="pesquisar tarefas..." class="w-full border rounded-lg px-3 py-3">
            <div>
                <!-- ADICIONA: flex gap-2 overflow-x-auto (no celular a barra de filtros rola de lado sem quebrar a página) -->
      <div class="flex gap-2 overflow-x-auto">
        <!-- ADICIONA nos 3 filtros: px-4 py-3 rounded-full whitespace-nowrap. Ativo (Todas): bg-indigo-600 text-white. Demais: bg-slate-200 -->
        <button class="px-4 py-3 rounded-full bg-amber-400 text-black whitespace-nowrap">Todas</button>
        <button class="px-4 py-3 rounded-full bg-slate-200 whitespace-nowrap">Pendentes</button>
        <button class="px-4 py-3 rounded-full bg-slate-200 whitespace-nowrap">Concluídas</button>
      </div>
    </section>

    <!-- Coluna 2: lista de tarefas -->
    <section>
      <!-- ADICIONA: space-y-3 (espaço entre as tarefas) -->
      <ul class="space-y-3">
        <!-- ADICIONA nos 3 <li> (repita nos 3): bg-white rounded-xl shadow p-4 flex flex-col gap-3 -->
        <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3">
          <!-- ADICIONA nos 3 <label>: flex items-start gap-3 -->
          <label class="flex items-start gap-3">
            <!-- ADICIONA nos 3 checkboxes: mt-1 w-5 h-5 -->
            <input type="checkbox" class="mt-1 w-5 h-5">
            <span>
              <!-- ADICIONA: block font-medium no título da tarefa e text-sm text-slate-500 na data (repita nos 3 itens) -->
              <span class="block font-medium">Trabalho de História</span>
              <span class="text-sm text-slate-500">20/10/2026</span>
            </span>
          </label>
          <!-- ADICIONA nas 3 <div> dos botões: flex gap-2 -->
          <div class="flex gap-2">
            <!-- ADICIONA nos 6 botões: flex-1 px-4 py-3 rounded-lg. Editar: bg-amber-100. Excluir: bg-red-100 text-red-700 -->
            <button class="flex-1 px-4 py-3 rounded-lg bg-amber-200">Editar</button>
            <button class="flex-1 px-4 py-3 rounded-lg bg-red-300 text-red-800">Excluir</button>
          </div>
        </li>

        <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3">
          <label class="flex items-start gap-3">
            <input type="checkbox" class="mt-1 w-5 h-5">
            <span>
              <span class="block font-medium">Estudar para a prova de Matemática</span>
              <span class="text-sm text-slate-500">22/10/2026</span>
            </span>
          </label>
          <div class="flex gap-2">
            <button class="flex-1 px-4 py-3 rounded-lg bg-amber-200">Editar</button>
            <button class="flex-1 px-4 py-3 rounded-lg bg-red-300 text-red-800">Excluir</button>
          </div>
        </li>

        <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3">
          <label class="flex items-start gap-3">
            <input type="checkbox" checked class="mt-1 w-5 h-5">
            <span>
              <span class="block font-medium">Entregar projeto no GitHub</span>
              <span class="text-sm text-slate-500">08/10/2026</span>
            </span>
          </label>
          <div class="flex gap-2">
            <button class="flex-1 px-4 py-3 rounded-lg bg-amber-200">Editar</button>
            <button class="flex-1 px-4 py-3 rounded-lg bg-red-300 text-red-800">Excluir</button>
          </div>
        </li>
      </ul>

      <!-- ADICIONA: mt-4 text-sm text-slate-500 -->
      <p class="mt-4 text-sm text-slate-500">2 tarefas pendentes</p>
    </section>

  </main>

</body>
</html>
